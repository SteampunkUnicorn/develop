<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Flip gravity. Avoid purple. Collect gold."><title>Gravity Flip</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<header><h1>Gravity Flip</h1><div class="score">Score <strong id="distance">0</strong></div><button id="pause" aria-label="Pause game" disabled>Pause</button></header>
<section class="arena" aria-label="Game"><canvas id="game" aria-label="Press Space, up arrow, or tap to flip gravity."></canvas><div id="overlay"><h2 id="title">Ready?</h2><p id="message">Flip gravity. Avoid purple. Follow the gold.</p><button id="play">Play</button></div></section>
<footer><p>Space / ↑ / tap to flip · P to pause</p></footer>
</main><script src="game.js"></script></body></html>
